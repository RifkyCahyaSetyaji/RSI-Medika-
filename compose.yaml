services:
  backend:
    build: ./web-be
    init: true
    env_file: ./web-be/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGIN: "http://localhost:${FRONTEND_PORT:-3000}"
      APP_URL: "http://localhost:${FRONTEND_PORT:-3000}"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"

  frontend:
    build: ./web-fe
    init: true
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
